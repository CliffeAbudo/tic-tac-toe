<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="game-container">
      <h1>Tic Tac Toe</h1>

      <p id="game-status">Player X,s turn</p>
      <div id="game-board" class="game-board">
        <button class="square" data-position="0" aria-label="Square 1"></button>
        <button class="square" data-position="1" aria-label="Square 2"></button>
        <button class="square" data-position="2" aria-label="Square 3"></button>

        <button class="square" data-position="3" aria-label="Square 4"></button>
        <button class="square" data-position="4" aria-label="Square 5"></button>
        <button class="square" data-position="5" aria-label="Square 6"></button>

        <button class="square" data-position="6" aria-label="Square 7"></button>
        <button class="square" data-position="7" aria-label="Square 8"></button>
        <button class="square" data-position="8" aria-label="Square 9"></button>

        <button id="restart-button">Restart Game</button>
      </div>
    </main>
    <script src="/js/script.js"></script>
  </body>
</html>
